# ==============================================================
# Docker Compose - ĐỒ ÁN QUẢN LÝ & BÁN QUẦN ÁO
# Dùng chung 1 SQL Server cho cả QuanLyDesktop (WinForms) và WebBanHang (ASP.NET Core MVC)
#
# Cách dùng:
#   1. Copy .env.example -> .env rồi điền mật khẩu SA
#   2. docker compose up -d
#   3. Chạy script CSDL_ShopQuanAo.sql (chỉ lần đầu, xem README.md)
# ==============================================================
name: fashionshop

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql2022
    environment:
      # Bắt buộc phải chấp nhận EULA thì container mới khởi động
      ACCEPT_EULA: "Y"
      # Developer = bản miễn phí cho học tập/dev, đầy đủ chức năng
      MSSQL_PID: "Developer"
      # Mật khẩu SA lấy từ file .env (KHÔNG hard-code vào file này)
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Chua cau hinh MSSQL_SA_PASSWORD trong file .env}"
    ports:
      # Chỉ mở trên loopback để máy khác trong LAN không truy cập được database
      - "127.0.0.1:1433:1433"
    volumes:
      # Volume đặt tên cố định: xóa/tạo lại container vẫn giữ nguyên dữ liệu
      - mssql_data:/var/opt/mssql
      # Mount sẵn script tạo DB để chạy bằng 1 lệnh sqlcmd trong container
      - ./CSDL_ShopQuanAo.sql:/scripts/CSDL_ShopQuanAo.sql:ro
    restart: unless-stopped
    healthcheck:
      # sqlcmd có sẵn trong image 2022-latest (thư mục mssql-tools18)
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      # SQL Server mất ~20-30s để khởi động lần đầu
      start_period: 30s

volumes:
  # name: đặt tên chính xác là "mssql_data" (không bị compose thêm tiền tố project)
  # => tương thích với volume đã tạo trước đó bằng "docker run", không mất dữ liệu
  mssql_data:
    name: mssql_data
